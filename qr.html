<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR code — Metalúrgica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap">
<style>
  :root{--verde:#26b247;--verde-mar:#1e8a55;--petroleo:#1f6076;--azul:#1b4984;--tinta:#12303f;--tinta-2:#51697a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Lexend","Segoe UI",Roboto,Arial,sans-serif;background:#eef3f4;color:var(--tinta);min-height:100vh;padding:24px 16px}
  .barra{max-width:520px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .barra a,.barra button{font:500 .95rem "Lexend",sans-serif;color:var(--petroleo);background:none;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 4px}
  .barra button{background:var(--petroleo);color:#fff;border-radius:10px;padding:10px 16px}
  .folha{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(10,30,50,.45)}
  .topo{background:linear-gradient(145deg,var(--verde),var(--verde-mar) 30%,var(--petroleo) 68%,var(--azul));color:#fff;padding:28px 28px 24px}
  .topo h1{font-weight:300;font-size:2.4rem;letter-spacing:-.02em;line-height:1}
  .topo p{margin-top:10px;font-size:1rem;opacity:.9}
  .corpo{padding:28px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  #qr{padding:14px;background:#fff;border:1px solid #e3ebee;border-radius:14px}
  #qr img,#qr canvas{display:block;width:260px!important;height:260px!important}
  .url{font-size:.85rem;color:var(--tinta-2);word-break:break-all;max-width:40ch}
  .aviso{font-size:.9rem;color:#8a4b00;background:#fff4e0;border-radius:10px;padding:10px 12px;line-height:1.45}
  .aviso[hidden]{display:none}
  @media print{
    body{background:#fff;padding:0}
    .barra{display:none}
    .folha{box-shadow:none;border-radius:0;max-width:none}
    .topo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #qr img,#qr canvas{width:9cm!important;height:9cm!important}
  }
</style>
</head>
<body>
<div class="barra">
  <a href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Voltar ao menu</a>
  <button type="button" onclick="window.print()">Imprimir</button>
</div>
<div class="folha">
  <div class="topo">
    <h1>Metalúrgica</h1>
    <p>Instruções de trabalho e planta da filial</p>
  </div>
  <div class="corpo">
    <div id="qr" role="img" aria-label="QR code da página principal"></div>
    <p>Aponte a câmera do celular para o código.</p>
    <p class="url" id="url"></p>
    <p class="aviso" id="aviso" hidden>Este arquivo foi aberto direto do computador. Publique o site no GitHub Pages e abra esta página pelo endereço do site para gerar o QR code correto.</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function(){
    var alvo = new URL('./', location.href).href;
    document.getElementById('url').textContent = alvo;
    if (location.protocol === 'file:') document.getElementById('aviso').hidden = false;
    if (!window.QRCode) {
      document.getElementById('qr').textContent = 'Não foi possível gerar o QR code. Verifique a conexão e recarregue a página.';
      return;
    }
    new QRCode(document.getElementById('qr'), {
      text: alvo, width: 520, height: 520,
      colorDark: '#12303f', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  })();
</script>
</body>
</html>
